<!DOCTYPE html>

<head th:replace="~{fragments/layout :: head('Accès refusé')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="contenu etroit">
    <section class="carte centre">
        <p class="code-erreur">403</p>

    </section>
</main>

</html>
